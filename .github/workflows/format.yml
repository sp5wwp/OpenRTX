name: "Format sources"
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: install-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check if there are format errors
        run: ./scripts/clang_format.sh --check
      - name: REUSE Compliance Check (confirm copyright and licenses)
        uses: fsfe/reuse-action@v6

  check-strings:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check the English string table matches stringsTable_t
        run: python3 ./scripts/check_strings.py
      - name: Check the translation template is up to date
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          ./scripts/update_pot.sh --check
